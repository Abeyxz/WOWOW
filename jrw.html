<!DOCTYPE html>
<html>
<head>

<title>Signup</title>

<style>

body{
font-family:"Segoe UI", sans-serif;
background: linear-gradient(135deg,#c8ff94,#91ffad);
margin:0;
padding:40px 0;
display:flex;
justify-content:center;
align-items:flex-start;
min-height:100vh;
overflow-y:auto;
}

/* sign up card container */
.container{
background:white;
width:450px;
max-width:90%;
padding:30px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* main title */
h2{
background-color: #fff1c3;
text-align:center;
margin-bottom:10px;
color:#333;
}

/* section headings */
h3{
margin-top:20px;
color:#006400;
}

/* input field styles */
input, select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:8px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
transition:0.2s;
}

/* input focus effect */
input:focus, select:focus{
outline:none;
border-color:#4facfe;
box-shadow:0 0 6px rgba(79,172,254,0.5);
}

/* radio and checkbox groups */
.radio-group,
.check-group{
margin-bottom:8px;
}

/* error text styles */
span{
color:#e63946;
font-size:12px;
display:block;
margin-bottom:8px;
}

/* success message style */
#successMessage{
color:green;
font-weight:bold;
text-align:center;
margin-top:10px;
}

/* submit button */
button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:8px;
background:#4facfe;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

/* button hover effect*/
button:hover{
background:#2a8df0;
transform:scale(1.03);
}

/* homelink style */
.home-link{
display:block;
text-align:center;
margin-top:15px;
text-decoration:none;
color:#4facfe;
font-weight:bold;
}

/* home link hover effect */
.home-link:hover{
text-decoration:underline;
}

</style>

</head>
<body>
    <!--main form of the container-->
    <div class="container">
        <!--form title-->
        <h2>Sign Up as a Volunteer!</h2>
        <!--this is where the form starts-->
        <form onsubmit="return validateForm()">
            <!--personal information section-->
            <h3>Personal Information</h3>
            <!--ask to input full name-->
           <label>Full Name</label>
           <input type="text" id="fullname" onblur="validateForm()">
           <!-- Error message for name validation -->
           <span id="nameError"></span>
            <!--ask to input birtdate-->
           <label>Birthdate</label>
           <input type="date" id="birthdate">
           <!-- Error message for birthdate validation -->
           <span id="birthError"></span>
            <!--ask to choose what sex the user is-->
           <label>Sex</label>
           <div class="radio-group">
            <input type="radio" name="sex"> Male
            <input type="radio" name="sex"> Female
            <input type="radio" name="sex"> Other

        </div>
        <!-- Error message for sex selection -->
        <span id="sexError"></span>        

        <h3>Account Details</h3>
        <!--ask to input email-->
        <label>Email</label>
        <input type="email" id="email">
        <!-- Error message for email validation -->
        <span id="emailError"></span>
        <!--ask to input username-->
        <label>Username</label>
        <input type="text" id="username">
        <!-- Error message for username validation-->
        <span id="userError"></span>
        <!--ask to input password-->
        <label>Password</label>
        <input type="password" id="password">
        <!-- Error message for password validation -->
        <span id="passError"></span>
        <!--ask to confirm the password inputted by the user-->
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword">
        <!-- Error message for confirm password validation -->
        <span id="confirmError"></span>
        <!--volunteer role-->
        <h3>Topic Questions</h3>
        <!--user select their interest in volunteering-->
        <label>What volunteer role interests you most?</label>
        <select id="topicSelect">
            <option value="">-- choose --</option>
            <option value="care">Care Volunteer</option>
            <option value="admin">Administrative Volunteer</option>
            <option value="outreach">Outreach Volunteer</option>
            <option value="rescue">Rescue Support Volunteer</option>
        </select>
        <!-- Error message for topic selection -->
        <span id="dropError"></span>
        <!--task checkbox section-->
        <label>Which tasks would you like to do?</label>
        <div class="check-group">
            <input type="checkbox" name="interests"> Feeding <br>
            <input type="checkbox" name="interests"> Cleaning <br>
            <input type="checkbox" name="interests"> Paperwork <br>
            <input type="checkbox" name="interests"> Events / Fundraising <br>
        </div>
        <!-- Error message for hour/s input -->
        <span id="checkError"></span>
        <!--user input how many hours will it take them to volunteer within a week-->
        <label>How many hours per week can you volunteer at the shelter?</label>
        <input type="number" id="thirdQuestion" min="0">
        <span id="thirdError"></span>
        <!--submit button-->
        <button type="submit">Join as a Volunteer!</button>
        <p id="successMessage"></p>
        <!--return to home link when user decides to go back-->
        <a href="index.html" class="home-link">Return to Homepage</a>
    </form>

</div>
<script src="script.js"></script>

</body>
</html>
